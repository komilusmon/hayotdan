<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - KomilUsmonDev</title>
    <style>
        body { background-color: #000000; color: #ffffff; font-family: monospace; padding: 20px; font-size: 15px; max-width: 600px; margin: auto; }
        button { background-color: #000000; color: #ffffff; border: 1px solid #555; padding: 10px 20px; margin: 15px 0; cursor: pointer; display: block; font-family: monospace; font-size: 15px; width: 100%; }
        button:hover { color: #d6ad5c; border-color: #d6ad5c; }
        form { margin-top: 20px; }
        label { display: block; margin-top: 15px; color: #d6ad5c; }
        input, textarea, select { background-color: #000000; color: #ffffff; border: 1px solid #333; padding: 10px; margin-top: 5px; width: 100%; font-family: monospace; box-sizing: border-box; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #d6ad5c; }
        select option { background-color: #000000; color: #ffffff; }
        #status-msg { margin-top: 15px; display: none; }
        .info-box { margin-top: 20px; padding: 10px; border: 1px dashed #555; color: #aaa; font-size: 13px; }
        .lang-switcher { margin-bottom: 20px; }
        .lang-btn { display: inline-block; width: auto; border: none; padding: 5px 10px; margin: 0; color: #fff; }
    </style>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript"> (function(){ emailjs.init({ publicKey: "L8EVbFKC61KtkIqh5", }); })(); </script>
</head>
<body>
    <div class="lang-switcher">
        <button class="lang-btn" onclick="setLanguage('uz')">[ UZ ]</button>
        <button class="lang-btn" onclick="setLanguage('ru')">[ RU ]</button>
        <button class="lang-btn" onclick="setLanguage('en')">[ EN ]</button>
    </div>

    <p data-i18n="support_title">> Ilovalar yordam markazi</p>
    <p data-i18n="support_desc">> Barcha dasturlar uchun texnik yordam va murojaatlar tizimi.</p>
    
    <form id="support-form">
        <label data-i18n="name_label">> Ismingiz *</label>
        <input type="text" id="from_name" required placeholder="Ismingizni kiriting" data-i18n="placeholder_name">
        
        <label data-i18n="email_label">> Email *</label>
        <input type="email" id="from_email" required placeholder="example@gmail.com" data-i18n="placeholder_email">

        <label data-i18n="app_name_label">> Qaysi dastur uchun? *</label>
        <input type="text" id="app_name" required placeholder="Masalan: Anfka, MarketManas..." data-i18n="placeholder_app">

        <label data-i18n="user_id_label">> Foydalanuvchi ID (Agar mavjud bo'lsa)</label>
        <input type="text" id="user_id" placeholder="ID yoki Username" data-i18n="placeholder_id">

        <label data-i18n="type_label">> Murojaat turi *</label>
        <select id="support_type" required>
            <option value="Texnik muammo">Texnik muammo</option>
            <option value="Akkaunt muammosi">Akkaunt muammosi</option>
            <option value="Blok / Apellyatsiya">Blok / Apellyatsiya</option>
            <option value="Taklif">Taklif</option>
        </select>

        <label data-i18n="subject_label">> Murojaat mavzusi *</label>
        <input type="text" id="subject" required placeholder="Muammo haqida qisqacha" data-i18n="placeholder_subject">
        
        <label data-i18n="details_label">> Tafsilotlar *</label>
        <textarea id="message" rows="5" required placeholder="Batafsil yozib qoldiring..." data-i18n="placeholder_details"></textarea>

        <label data-i18n="appeal_label">> Apellyatsiya sababi (Faqat bloklanganlar uchun)</label>
        <textarea id="appeal_reason" rows="3" placeholder="Nima sababdan blok noto'g'ri deb hisoblaysiz?" data-i18n="placeholder_appeal"></textarea>
        
        <button type="submit" id="submit-btn" data-i18n="send_btn">> Murojaatni yuborish</button>
    </form>

    <p id="status-msg"></p>
    <div class="info-box" data-i18n="support_info">- Tizim avtomatik ravishda so'rovingizni tekshiradi. Javob emailga yuboriladi.</div>
    <br><button onclick="window.location.href='index.html'" style="border: none;" data-i18n="back_home">> Bosh sahifaga qaytish</button>

    <script src="lang.js"></script>
    <script>
        document.getElementById('support-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const statusMsg = document.getElementById('status-msg');
            const submitBtn = document.getElementById('submit-btn');
            
            const currentLang = localStorage.getItem('app_lang') || 'uz';
            submitBtn.innerText = translations[currentLang].sending || '> Yuborilmoqda...';
            
            const params = {
                from_name: document.getElementById('from_name').value,
                from_email: document.getElementById('from_email').value,
                app_name: document.getElementById('app_name').value,
                user_id: document.getElementById('user_id').value || "-",
                support_type: document.getElementById('support_type').value,
                subject: document.getElementById('subject').value,
                message: document.getElementById('message').value,
                appeal_reason: document.getElementById('appeal_reason').value || "-",
                time: new Date().toLocaleString()
            };
            
            emailjs.send('service_38spzgp', 'template_7r4r11d', params)
                .then(() => {
                    statusMsg.style.display = 'block'; statusMsg.style.color = '#00ff00';
                    statusMsg.innerText = translations[currentLang].success_msg || 'Success!';
                    submitBtn.innerText = translations[currentLang].send_btn;
                    document.getElementById('support-form').reset();
                }, (error) => {
                    statusMsg.style.display = 'block'; statusMsg.style.color = '#ff5555';
                    statusMsg.innerText = translations[currentLang].error_msg + (error.text || '');
                    submitBtn.innerText = translations[currentLang].send_btn;
                });
        });
    </script>
</body>
</html>
