<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - KomilUsmonDev</title>
    <style>
        body { background-color: #000000; color: #ffffff; font-family: monospace; padding: 20px; font-size: 15px; }
        button { background-color: #000000; color: #ffffff; border: 1px solid #555; padding: 10px 20px; margin: 15px 0; cursor: pointer; display: block; font-family: monospace; font-size: 15px; width: 100%; max-width: 400px;}
        button:hover { color: #d6ad5c; border-color: #d6ad5c; }
        form { margin-top: 20px; max-width: 400px; }
        label { display: block; margin-top: 15px; color: #d6ad5c; }
        input, textarea { background-color: #000000; color: #ffffff; border: 1px solid #333; padding: 10px; margin-top: 5px; width: 100%; font-family: monospace; box-sizing: border-box; }
        input:focus, textarea:focus { outline: none; border-color: #d6ad5c; }
        #status-msg { margin-top: 15px; display: none; }
        .lang-switcher { margin-bottom: 20px; }
        .lang-btn { display: inline-block; width: auto; border: none; padding: 5px 10px; margin: 0; color: #fff; }
    </style>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript"> (function(){ emailjs.init({ publicKey: "L8EVbFKC61KtkIqh5", }); })(); </script>
</head>
<body>
    <div class="lang-switcher">
        <button class="lang-btn" onclick="setLanguage('uz')">[ UZ ]</button>
        <button class="lang-btn" onclick="setLanguage('ru')">[ RU ]</button>
        <button class="lang-btn" onclick="setLanguage('en')">[ EN ]</button>
    </div>

    <p data-i18n="contact_title">> Men bilan bog'lanish</p>
    <p data-i18n="contact_desc">> To'g'ridan-to'g'ri pochtamga xabar yuborish uchun formani to'ldiring.</p>
    
    <form id="contact-form">
        <label data-i18n="name_label">> Ismingiz *</label>
        <input type="text" id="user_name" required placeholder="Ismingizni kiriting" data-i18n="placeholder_name">
        
        <label data-i18n="email_label">> Email *</label>
        <input type="email" id="user_email" required placeholder="example@gmail.com" data-i18n="placeholder_email">
        
        <label data-i18n="msg_label">> Xabar *</label>
        <textarea id="message" rows="5" required placeholder="Xabaringizni yozing..." data-i18n="placeholder_msg"></textarea>
        
        <button type="submit" id="submit-btn" data-i18n="send_btn">> Yuborish</button>
    </form>

    <p id="status-msg"></p>
    <button onclick="window.location.href='index.html'" style="border: none;" data-i18n="back_home">> Bosh sahifaga qaytish</button>

    <script src="lang.js"></script>
    <script>
        document.getElementById('contact-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const statusMsg = document.getElementById('status-msg');
            const submitBtn = document.getElementById('submit-btn');
            
            const currentLang = localStorage.getItem('app_lang') || 'uz';
            submitBtn.innerText = translations[currentLang].sending || '> Yuborilmoqda...';
            
            emailjs.send('service_38spzgp', 'template_8qmsb8q', {
                user_name: document.getElementById('user_name').value,
                user_email: document.getElementById('user_email').value,
                message: document.getElementById('message').value,
            }).then(() => {
                statusMsg.style.display = 'block'; statusMsg.style.color = '#00ff00';
                statusMsg.innerText = translations[currentLang].success_msg;
                submitBtn.innerText = translations[currentLang].send_btn;
                document.getElementById('contact-form').reset();
            }, (error) => {
                statusMsg.style.display = 'block'; statusMsg.style.color = '#ff0000';
                statusMsg.innerText = translations[currentLang].error_msg + (error.text || '');
                submitBtn.innerText = translations[currentLang].send_btn;
            });
        });
    </script>
</body>
</html>
