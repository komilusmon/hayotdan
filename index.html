<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KomilUsmonDev - Terminal</title>
    <style>
        body { 
            background-color: #000000; 
            color: #ffffff; 
            font-family: monospace; 
            padding: 20px; 
            font-size: 15px;
        }
        button { 
            background-color: #000000; 
            color: #d6ad5c; 
            border: 1px solid #333; 
            border-radius: 5px; 
            padding: 10px 20px; 
            margin: 5px 0; 
            cursor: pointer; 
            display: block; 
            text-align: center; 
            font-family: monospace; 
            font-size: 15px; 
            width: 100%; 
            max-width: 400px; 
        }
        button:hover { 
            color: #ffffff; 
            background-color: #222; 
        }
        .header-text { 
            color: #aaaaaa; 
            margin-top: 20px; 
        }
        
        /* Til tanlash va Rasm joylashuvi uchun Header */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            max-width: 400px; /* Tugmalar kengligi bilan bir xil qilish */
        }

        .lang-switcher { 
            display: flex;
            gap: 5px;
        }
        
        .lang-btn { 
            display: inline-block; 
            width: auto; 
            border: none; 
            padding: 5px; 
            margin: 0; 
            color: #fff; 
        }

        /* Profil rasmi uslubi */
        .profile-pic {
            width: 60px; /* Rasm hajmi */
            height: 60px;
            border-radius: 50%; /* Dumaloq qilish */
            object-fit: cover;
            border: 2px solid #d6ad5c; /* Tillarang ramka */
            box-shadow: 0 0 10px rgba(214, 173, 92, 0.3);
        }
    </style>
</head>
<body>
    
    <!-- Yuqori qism (Tillar va Rasm) -->
    <div class="top-header">
        <div class="lang-switcher">
            <button class="lang-btn" onclick="setLanguage('uz')">[ UZ ]</button>
            <button class="lang-btn" onclick="setLanguage('ru')">[ RU ]</button>
            <button class="lang-btn" onclick="setLanguage('en')">[ EN ]</button>
        </div>
        
        <!-- Sizning rasmingiz -->
        <img src="komilusmondev.jpg" alt="KomilUsmonDev" class="profile-pic">
    </div>

    <!-- Asosiy matnlar -->
    <p data-i18n="sys_init">> Tizim ishga tushirilmoqda...</p>
    <p data-i18n="welcome">> KomilUsmonDev terminaliga xush kelibsiz.</p>
    <br>
    <p data-i18n="about_1">- Salom, men Komil Usmonqulov.</p>
    <p data-i18n="about_2">- 1-yillik tajribaga ega dasturchiman.</p>
    <p data-i18n="about_3">- Android (Kotlin), Web, Python va 3D dizayn yo'nalishlarida ishlayman.</p>
    
    <p class="header-text" data-i18n="main_menu">--- ASOSIY MENYU ---</p>
    <button onclick="window.location.href='projects.html'" data-i18n="btn_projects">[1] Loyihalar va Ilovalar</button>
    <button onclick="window.location.href='contact.html'" data-i18n="btn_contact">[2] Men bilan bog'lanish (EmailJS)</button>
    <button onclick="window.location.href='support.html'" data-i18n="btn_support">[3] Ilovalar yordam markazi</button>
    <button onclick="window.location.href='privacy.html'" data-i18n="btn_privacy">[4] Maxfiylik siyosati</button>
    
    <p class="header-text" data-i18n="social_links">--- TARMOQLAR ---</p>
    <button onclick="window.open('https://github.com/komilusmon', '_blank')">> GitHub</button>
    <button onclick="window.open('https://youtube.com/@komilusmondev', '_blank')">> YouTube</button>
    <button onclick="window.open('https://t.me/komilusmondev', '_blank')">> Telegram</button>

    <script src="lang.js"></script>
</body>
</html>
